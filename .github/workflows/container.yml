# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). The merge does not
# rebuild: it promotes the pull request's gated digest to :main, and a v* tag
# copies main's digest to the version tags and :latest. Quay.io only.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "10 5 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.51.0
    permissions:
      contents: read
      issues: write   # the alert job files a failed schedule as an issue
      pull-requests: read
    with:
      image: quay.io/crunchtools/mcp-slack
      boot: mcp
      # Dummy settings: config loads at startup, no request reaches them.
      boot-env: |
        SLACK_USER_TOKEN=gate-dummy
      # Hosts refuse an unsigned quay.io/crunchtools image
      # (crunchtools/rhel10-bootc-server#47). Promote signs the gated digest
      # before any tag moves, with the key from this repo's cosign-signing
      # environment (main and v* only); without it promote refuses.
      sign: true
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
